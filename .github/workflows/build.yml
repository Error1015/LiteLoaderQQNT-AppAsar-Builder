name: build-app-asar

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      loader_path:
        description: "LiteLoaderQQNT 目录（写入产物；运行期可被 LQ_LOADER 覆盖）"
        required: false
        default: "C:/LiteLoaderQQNT"
      qq_version:
        description: "覆盖清单版本号，如 9.9.37-54395（留空用内置基线）"
        required: false
        default: ""
      build_version:
        description: "覆盖 buildVersion，如 54395（留空用内置基线）"
        required: false
        default: ""
      release_type:
        description: "发布等级：none=只出构建产物 / prerelease=预发布 / release=正式发布"
        type: choice
        required: true
        default: "none"
        options:
          - none
          - prerelease
          - release
      release_tag:
        description: "Release 标签（留空自动取 v<构建器版本>；标签已存在时会更新该 Release）"
        required: false
        default: ""

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        # 必须 --ignore-scripts：package.json 曾用 "install" 钩子部署到本机 QQ，CI 上没有 QQ
        run: npm ci --ignore-scripts

      - name: 构建 app.asar
        env:
          LOADER: ${{ inputs.loader_path || vars.LQ_LOADER_PATH || 'C:/LiteLoaderQQNT' }}
          QQ_VERSION: ${{ inputs.qq_version || vars.LQ_QQ_VERSION || '' }}
          BUILD_VERSION: ${{ inputs.build_version || vars.LQ_BUILD_VERSION || '' }}
        run: |
          set -euo pipefail
          args=(--loader="$LOADER" --allow-missing-loader --out=dist)
          if [ -n "$QQ_VERSION" ]; then args+=(--qq-version="$QQ_VERSION"); fi
          if [ -n "$BUILD_VERSION" ]; then args+=(--build-version="$BUILD_VERSION"); fi
          node build-asar.js "${args[@]}"

      # 版本信息全部由 build-info.json 反查，避免 workflow 里二次拼装导致两处不一致
      - name: 读取产物元信息
        id: meta
        run: |
          node -e "const fs=require('fs');const i=require('./dist/build-info.json');const o=process.env.GITHUB_OUTPUT;const w=(k,v)=>fs.appendFileSync(o,k+'='+v+'\n');w('zip',i.suggestedFileName);w('builder',i.builder.version);w('commit',i.builder.commit||'-');w('qq',i.qq.version||'unknown');w('loaderMode',i.loader.mode);"
          echo "--- GITHUB_OUTPUT ---"
          cat "$GITHUB_OUTPUT"

      # 发布与否、用什么标签、是不是预发布，全部在这里判定一次，后续步骤只读输出
      - name: 确定发布参数
        id: rel
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag 触发：标签里带 '-'（如 v1.0.2-beta.1）视为预发布，语义交给版本号自己表达
            TAG="${{ github.ref_name }}"
            case "$TAG" in
              *-*) PRE="true" ;;
              *)   PRE="false" ;;
            esac
            ENABLED="true"
            LEVEL="auto"
          else
            # 手动触发：发布等级由下拉框决定，空标签回退到 v<构建器版本>
            TAG="${{ inputs.release_tag }}"
            [ -n "$TAG" ] || TAG="v${{ steps.meta.outputs.builder }}"
            case "${{ inputs.release_type }}" in
              prerelease) PRE="true";  ENABLED="true";  LEVEL="prerelease" ;;
              release)    PRE="false"; ENABLED="true";  LEVEL="release" ;;
              *)          PRE="false"; ENABLED="false"; LEVEL="none" ;;
            esac
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: 打包发布产物
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail
          # 用 -j 丢掉目录层级；不要在 cd dist 之后用 ../$ZIP 当归档路径，
          # zip 会把它当成待压缩文件而报 "name not matched"
          zip -j "$ZIP" dist/app.asar dist/build-info.json
          ls -l dist/app.asar "$ZIP"
          unzip -l "$ZIP"

      - name: 写入运行摘要
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "- 构建器版本：\`${{ steps.meta.outputs.builder }}\`（commit \`${{ steps.meta.outputs.commit }}\`）"
            echo "- 目标 QQ：\`${{ steps.meta.outputs.qq }}\`"
            echo "- 宿主模式：${{ steps.meta.outputs.loaderMode }}"
            echo "- 产物：\`${{ steps.meta.outputs.zip }}\`"
            echo "- 发布决策：${{ steps.rel.outputs.enabled == 'true' && format('`{0}`（prerelease={1}）', steps.rel.outputs.tag, steps.rel.outputs.prerelease) || '不发 Release，仅保留 artifact' }}"
            echo ""
            echo '```json'
            cat dist/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LiteLoaderQQNT-AppAsar-${{ steps.meta.outputs.builder }}-qq${{ steps.meta.outputs.qq }}
          path: |
            dist/app.asar
            dist/build-info.json
            ${{ steps.meta.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        # tag 推送恒发；手动触发看 release_type（none 时跳过）
        if: steps.rel.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          # tag 已存在时 GitHub 会忽略此项；手动触发时用它把新标签钉在本次构建的 commit 上
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.tag }} · QQNT ${{ steps.meta.outputs.qq }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          # 预发布不抢 Latest 标记，正式发布才更新
          make_latest: ${{ steps.rel.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: ${{ steps.meta.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            QQNT 的 `app.asar` 注入包（含 LiteLoaderQQNT 入口转发）。

            | 项目 | 值 |
            | --- | --- |
            | 构建器版本 | `${{ steps.meta.outputs.builder }}`（commit `${{ steps.meta.outputs.commit }}`） |
            | 目标 QQ 版本 | `${{ steps.meta.outputs.qq }}` |
            | 宿主路径模式 | ${{ steps.meta.outputs.loaderMode }} |
            | 产物文件 | `${{ steps.meta.outputs.zip }}` |
            | 发布等级 | ${{ steps.rel.outputs.prerelease == 'true' && '预发布（pre-release）' || '正式发布' }} |

            `app.asar` 内含 `lq-build.json`，部署后可随时用 `node install.js --status` 查回本表信息。

            ### 使用方法
            1. 解压 `${{ steps.meta.outputs.zip }}`，得到 `app.asar` 与 `build-info.json`；
            2. 备份 `QQ\versions\<版本>\resources\app.asar`（如已存在）；
            3. 把 `app.asar` 覆盖到该目录，重启 QQ；
            4. 若宿主不在默认位置，启动前设置环境变量 `LQ_LOADER=你的 LiteLoaderQQNT 目录`；
               QQ 起不来时设 `LQ_INJECT_DISABLE=1` 可直连原生启动。

            详细说明见仓库 README。
